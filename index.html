<!DOCTYPE html>
<html>
<head>
  <title>Tienda de Ropa</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>Nombre de tu tienda</h1>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Productos</a>
      <a href="#">Contacto</a>
    </nav>
  </header>

  <section class="banner">
    <h2>Nueva Colección</h2>
    <p>Descubre las últimas tendencias</p>
  </section>

  <section class="productos">
    <div class="producto">
      <img src="https://picsum.photos/300/400?random=1" alt="Camiseta básica">
      <h3>Camiseta básica</h3>
      <p>$20.00</p>
      <button>Añadir al carrito</button>
    </div>
    <div class="producto">
      <img src="https://picsum.photos/300/400?random=2" alt="Jeans ajustados">
      <h3>Kimono</h3>
      <p>$20.00</p>
      <button>Añadir al carrito</button>
    </div>
    <div class="producto">
      <img src="https://picsum.photos/300/400?random=3" alt="Vestido floral">
      <h3>Vestido floral</h3>
      <p>$35.00</p>
      <button>Añadir al carrito</button>
    </div>
  </section>

  <footer>
    <p>© 2025 Alt Grail</p>
  </footer>
</body>
</html>
